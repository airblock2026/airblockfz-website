
#   🔐 **키가 앱 밖에 사는 자리.** 이 워크플로만 OW_KEY 를 안다(리포 Secrets).
#   매시 18개 도시를 수집해 `uaeair/*.json` 으로 커밋하면 GitHub Pages 가 그대로 서빙한다.
#
# 설치:
#   1) airblockfz-website 리포에 이 파일을 `.github/workflows/uaeair-collect.yml` 로 넣는다
#   2) Settings → Secrets and variables → Actions → New repository secret
#        이름 OW_KEY / 값 = OpenWeather 키
#   3) collector/ 폴더와 www/data/cities.js 를 리포에 같이 둔다(경로는 아래 env 로 맞춘다)
#
# 🚨 실패한 도시는 이전 파일이 그대로 남는다(수집기가 그렇게 만들어져 있다).
# 🚨 변경이 없으면 커밋하지 않는다 — 빈 커밋으로 히스토리를 더럽히지 않는다.
name: UAE Air & Dust — collect
on:
  schedule:
    - cron: '7 * * * *'      # 매시 7분 (정각은 혼잡하다)
  workflow_dispatch:          # 손으로도 돌릴 수 있게

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: 수집
        env:
          OW_KEY: ${{ secrets.OW_KEY }}
        run: node collector/collect.mjs uaeair collector/uaeair/cities.js
      - name: 변경 있으면 커밋
        run: |
          git config user.name  "uaeair-collector"
          git config user.email "actions@users.noreply.github.com"
          git add uaeair
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "uaeair: $(date -u '+%Y-%m-%d %H:%M') UTC 수집"
            # 🚨 두 나라 수집기가 같은 리포에 **동시에 밀면 한쪽이 통째로 실패한다**
            #    (2026-08-20 실측: UAE 06:00 실행이 non-fast-forward 로 죽어 그 시각 데이터가 사라졌다).
            #    rebase 로 상대 커밋 위에 얹어 다시 민다. 우리 커밋끼리는 파일이 겹치지 않아 충돌이 없다.
            for i in 1 2 3 4 5; do
              git push && break
              echo "push 충돌 — $i 번째 재시도"
              sleep $((RANDOM % 10 + 3))
              git pull --rebase --autostash origin main || exit 1
            done
          fi
