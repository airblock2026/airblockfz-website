# 🔔 Investor Sentiment 데이터 신선도 감시
#
#   발행기는 사장님 맥에서 돈다(launchd). 맥이 자거나 PATH 가 깨지면 **조용히 멈춘다** —
#   코스피가 2026-08-13 ~ 09-01, 19일간 그렇게 멈춰 있었고 아무도 몰랐다(커밋 9752174a).
#   그래서 감시는 **발행기와 다른 기계에서** 돈다. 같이 죽으면 감시가 아니다.
#
#   하는 일: data.json 의 built 시각이 30시간을 넘었으면 워크플로를 실패시킨다.
#            → 깃허브가 리포 소유자에게 실패 메일을 보낸다.
name: Investor Sentiment — 신선도 감시

on:
  schedule:
    - cron: '30 6 * * 2-6'     # UTC 06:30 = 두바이 10:30 — 발행(09:00) 90분 뒤
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 신선도 확인
        run: |
          F=investor-sentiment/data.json
          if [ ! -f "$F" ]; then echo "::error::$F 가 없습니다"; exit 1; fi
          python3 - <<'PY'
          import json, sys, datetime
          d = json.load(open('investor-sentiment/data.json'))
          built = datetime.datetime.fromisoformat(d['built'].replace('Z', '+00:00'))
          age_h = (datetime.datetime.now(datetime.timezone.utc) - built).total_seconds() / 3600
          n = len(d.get('s', []))
          print(f"기준일 {d.get('asOf')} · 발행 {built:%Y-%m-%d %H:%M} UTC · {age_h:.1f}시간 전 · 종목 {n}개")
          bad = []
          if age_h > 30: bad.append(f"데이터가 {age_h:.1f}시간 낡았습니다 (한계 30시간) — 맥의 발행기가 멈춘 것 같습니다")
          if n < 200:    bad.append(f"종목이 {n}개뿐입니다 (정상 약 355개)")
          if not d.get('asOf'): bad.append("기준일(asOf)이 비어 있습니다")
          for b in bad: print(f"::error::{b}")
          sys.exit(1 if bad else 0)
          PY
